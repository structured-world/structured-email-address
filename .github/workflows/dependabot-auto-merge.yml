name: Dependabot Auto-Merge

# `pull_request_target`, not `pull_request`, because of how Dependabot runs are
# isolated: a workflow triggered by Dependabot on `pull_request` receives
# Dependabot secrets rather than Actions secrets, so the organisation's
# RELEASER_APP_* secrets resolve to empty strings and the App token step fails
# before it does anything. `pull_request_target` runs in the base branch's
# context, where those secrets are available, which is also GitHub's own
# recommendation for this pattern.
#
# That context carries write-capable credentials, so this workflow must never
# execute code from the pull request. It does not: there is no checkout, and
# every step either reads PR metadata through the API or drives `gh`. Do not add
# a checkout here — and if one ever becomes necessary, it must not use the head
# ref.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  # Only what GITHUB_TOKEN needs: `dependabot/fetch-metadata` reads the pull
  # request. Approving and merging are done with the App token below, so nothing
  # here needs write access to the repository contents.
  pull-requests: read

# One run per pull request, and a new push cancels the run it superseded rather
# than leaving it racing toward a head that no longer exists.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Both the author and the actor, not just the author. `synchronize` fires
    # for any push to the pull request's branch, and the author stays
    # dependabot[bot] no matter who pushed — so checking the author alone lets a
    # maintainer add commits to an open Dependabot PR and have this job approve
    # and auto-merge them with the App token, which is precisely the independent
    # review that approval is supposed to represent.
    # `triggering_actor` as well as `actor`: on a rerun the latter keeps the
    # original run's value, so only the former shows who asked for this one.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.triggering_actor == 'dependabot[bot]'

    steps:
      # Pinned to commit SHAs, not tags, because `pull_request_target` puts the
      # App's private key within reach of whatever these resolve to: retargeting
      # a mutable tag would be enough to take it. Dependabot updates a pinned
      # SHA the same way it updates a tag, so this costs nothing to maintain.
      # Repository-wide pinning is tracked separately in #78.
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.1
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate App Token
        id: app-token
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

      - name: Approve and enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # Both operations name the head this run actually inspected, rather than
        # just the pull request. Without that they act on whatever the head is
        # by the time they run, which is not necessarily what the checks above
        # passed on: a push can land in between, and a rerun of an older run
        # keeps `github.actor` as dependabot while pointing at a newer head. The
        # approval is recorded against a commit id, and the merge refuses
        # outright if the head has moved.
        run: |
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE -f commit_id="$HEAD_SHA" --silent
          gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
