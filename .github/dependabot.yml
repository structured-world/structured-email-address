version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The requirement is `0`, so every published data release already satisfies
      # it and CI resolves the newest one on each run. A lockfile bump would
      # change nothing a consumer sees.
      - dependency-name: "structured-public-domains"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "ci(deps)"
