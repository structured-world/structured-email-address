[package]
name = "structured-email-address-wasm"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
description = "WebAssembly bindings behind the @structured-world/structured-email-address npm packages."
license = "Apache-2.0"
publish = false

[lib]
# `cdylib` is the WebAssembly module; `rlib` lets the native parity harness and
# the data generators link the same conversion code the module runs.
crate-type = ["cdylib", "rlib"]

[dependencies]
# `psl` embeds the Public Suffix List trie, so the module answers every lookup
# itself and never reaches the network.
structured-email-address = { path = "../..", default-features = false, features = [
    "std",
    "psl",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = "1"
# The confusables generator reads the same tables the crate's skeleton does;
# the versions follow the crate's own, which is what keeps the TypeScript table
# in step with it.
unicode-normalization = "0.1"
unicode-security = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
