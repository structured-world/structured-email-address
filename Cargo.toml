[package]
name = "structured-email-address"
version = "0.0.19"
edition = "2024"
rust-version = "1.92"
authors = ["Dmitry Prudnikov <mail@polaz.com>"]
description = "RFC 5321/5322/6531 email address parser, validator, and normalizer. Subaddress extraction, provider-aware normalization, PSL domain validation, anti-homoglyph protection."
documentation = "https://docs.rs/structured-email-address/"
repository = "https://github.com/structured-world/structured-email-address"
license = "Apache-2.0"
readme = "README.md"
keywords = ["email", "email-address", "validation", "rfc-5322", "normalization"]
categories = ["parser-implementations", "text-processing"]

[features]
default = ["std", "serde", "psl"]
# The crate is written against `core` + `alloc`; an allocator is not optional,
# since every parse produces owned strings. This feature carries no code of its
# own and exists so a no-std consumer can name the shape it is asking for.
alloc = []
# Everything that genuinely needs an operating system: `std::error::Error`
# integration in dependencies, and rayon's thread pool.
std = ["alloc", "idna/std", "unicode-normalization/std", "serde?/std"]
# `serde/alloc`, not just the dependency: the impls here serialize `String`, and
# serde only provides its `String` impls behind `alloc` or `std`. Without this
# the advertised `alloc,serde` combination does not compile.
serde = ["dep:serde", "serde/alloc", "alloc"]
# Implies `std` because the published structured-public-domains still does.
# Without this a consumer can select `alloc,psl` and get a missing-`std` error
# from inside a dependency instead of a configuration this crate supports.
# Relaxable once that crate ships its own no-std build: see #77.
psl = ["dep:structured-public-domains", "std"]
rayon = ["dep:rayon", "std"]

[dependencies]
idna = { version = "1.1", default-features = false, features = [
    "alloc",
    "compiled_data",
] }
structured-public-domains = { version = "0", optional = true }
serde = { version = "1", default-features = false, features = [
    "derive",
], optional = true }
unicode-normalization = { version = "0.1", default-features = false }
unicode-security = { version = "0.1", default-features = false }
rayon = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.8", features = ["html_reports"] }
roxmltree = "0.21.1"

[[bench]]
name = "email"
harness = false

# Lints for production code are set via cfg_attr(not(test)) in lib.rs,
# which correctly excludes test code from deny(unwrap_used, expect_used, panic).
